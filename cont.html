<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contul tău · Noir</title><style>body{margin:0;background:#f6f3ee;color:#292722;font:16px system-ui}main{max-width:420px;margin:8vh auto;padding:28px}a{color:inherit}h1{font-size:36px}label{display:block;margin:18px 0}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font:inherit}button{padding:13px;border:0;border-radius:8px;font:inherit;cursor:pointer}button[type=submit]{background:#343c2f;color:white;width:100%}[hidden]{display:none!important}#status{line-height:1.6}#switch{margin-top:18px}small{line-height:1.6;display:block}</style></head>
<body><main><a href="./">← Înapoi la Noir</a><h1>Contul tău.</h1><p>Noir este destinat persoanelor de cel puțin 18 ani.</p><form id="authForm"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Parolă<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><div id="signupFields" hidden><label>Nume afișat<input name="displayName" maxlength="40"></label><label>Data nașterii<input name="birthDate" type="date"></label><small>Introdu data nașterii cu anul din 4 cifre. Accesul este pentru adulți 18+. Identitatea nu este verificată prin acest formular.</small></div><button type="submit" id="submit">Conectează-te</button></form><button id="switch" type="button">Creează un cont</button><button id="logout" hidden>Deconectează-te</button><p id="status" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js?v=2"></script><script src="backend.js?v=4"></script><script src="cont.js?v=4"></script></body></html>
